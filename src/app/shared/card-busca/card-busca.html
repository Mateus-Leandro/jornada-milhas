<mat-card class="card-busca" appearance="outlined">
    <img mat-card-image [src]="imagem()" [alt]="alt()">
    <mat-card-content>
        <ul>
            <li>{{nomeLocal()}}</li>
            <li>R$ {{valor()}}</li>
        </ul>
    </mat-card-content>
    <mat-card-actions>
        <button matButton="filled">VER DETALHES</button>
    </mat-card-actions>
</mat-card>
