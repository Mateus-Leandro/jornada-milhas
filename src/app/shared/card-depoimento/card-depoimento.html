<mat-card class="example-card" appearance="outlined">
    <mat-card-header>
        <img mat-card-avatar [src]="img()" [alt]="alt()" />
        <mat-card-title>{{ nome() }}</mat-card-title>
    </mat-card-header>

    <mat-card-content class="content">
        <span>{{ mensagem() }}</span>
        <h4 class="nome">{{ nome() }}</h4>
    </mat-card-content>
</mat-card>
