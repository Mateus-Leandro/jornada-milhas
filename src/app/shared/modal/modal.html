<section class="modal">
    <h1 mat-dialog-title>Viajante</h1>
    <div mat-dialog-content>
        <div class="selecao-idade">
            <ul>
                <li class="titulo">Adultos</li>
                <li>(Acima de 12 anos)</li>
                <li>
                    <app-seletor-quantidade [(valor)]="adultos" [minimo]="0" />
                </li>
            </ul>
            <ul>
                <li class="titulo">Crianças</li>
                <li>(Entre 2 e 11 anos)</li>
                <li>
                    <app-seletor-quantidade [(valor)]="criancas" [minimo]="0" />
                </li>
            </ul>
            <ul>
                <li class="titulo">Bebês</li>
                <li>Até 2 anos</li>
                <li>
                    <app-seletor-quantidade [(valor)]="bebes" [minimo]="0" />
                </li>
            </ul>
        </div>
        <div class="selecao-categoria">
            <h3>Categoria</h3>
            <div>
                <mat-chip-listbox aria-label="Seleção de categorias">
                    <mat-chip-option selected>Econômica</mat-chip-option>
                    <mat-chip-option>Executiva</mat-chip-option>
                </mat-chip-listbox>
            </div>
        </div>
    </div>
    <div mat-dialog-actions>
        <button mat-button mat-dialog-close>Cancelar</button>
        <button matButton="filled" [mat-dialog-close]="{buscar: true}">Buscar</button>
    </div>
</section>
