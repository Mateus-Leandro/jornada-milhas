<mat-form-field class="input-container" appearance="outline">
    <mat-label>{{label()}}</mat-label>
    <mat-icon matPrefix>
        {{iconePrefix()}}
    </mat-icon>
    <input matInput [matAutocomplete]="auto" [formControl]="control()" ngDefaultControl>
    <mat-icon matSuffix>search</mat-icon>
    <mat-autocomplete #auto="matAutocomplete">
        @for (estado of opcoesFiltradas(); track estado.nome) {
        <mat-option [value]="estado.nome">{{estado.nome}}</mat-option>
        }
    </mat-autocomplete>
</mat-form-field>
