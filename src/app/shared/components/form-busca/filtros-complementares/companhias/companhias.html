<section class="companhias">
    <app-label texto="Companhias" />
    <div class="checkbox-group">
        @for (opcao of companhias; track $index) {
        <p>
            <mat-checkbox color="primary" (change)="alternarCompanhia(opcao, $event.checked)"
                [checked]="companhiaSelecionada(opcao)">
                {{opcao.nome}}
            </mat-checkbox>
        </p>
        }
    </div>
</section>
