<section class="precos">
    <app-label texto="Preço" class="label" />
    <div class="labels">
        <div class="label-container">
            <label for="preco-minimo" class="name-label">De</label>
            <p>{{ passagemService.precoMinimo | currency:'BRL' }}</p>
        </div>
        <div class="label-container">
            <label for="preco-maximo">Até</label>
            <p>{{ passagemService.precoMaximo| currency:'BRL' }}</p>
        </div>
    </div>
    <mat-slider [min]="passagemService.precoMinimo" [max]=" passagemService.precoMaximo">
        <input id="preco-minimo" matSliderStartThumb [formControl]="precoMin">
        <input id="preco-maximo" matSliderEndThumb [formControl]="precoMax">
    </mat-slider>
</section>
